name: Release

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - "scripts/**"
      - "justfile"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build DMG and publish
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      NOTARY_APPLE_ID: ${{ github.ref_type == 'tag' && secrets.NOTARY_APPLE_ID || '' }}
      NOTARY_PASSWORD: ${{ github.ref_type == 'tag' && secrets.NOTARY_PASSWORD || '' }}
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(scripts/release.sh version | cut -d' ' -f1)"
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Check release readiness
        run: scripts/release.sh check "$RELEASE_VERSION"

      - name: Require the tag to be on main
        if: github.ref_type == 'tag'
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit on main"
            exit 1
          fi

      - name: Require CI to have passed on the tagged commit
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)"
          if [ "$passed" -eq 0 ]; then
            echo "::error::CI has not passed on $GITHUB_SHA"
            exit 1
          fi

      - name: Require a certificate when signing is configured
        if: env.DEVELOPER_ID_APPLICATION != '' && env.MACOS_CERTIFICATE_P12 == ''
        run: |
          echo "::error::DEVELOPER_ID_APPLICATION is set but MACOS_CERTIFICATE_P12 is missing"
          exit 1

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(uuidgen)"
          certificate="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$certificate"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build DMG
        run: scripts/create_dmg.sh "$RELEASE_VERSION"

      - name: Write release notes
        run: scripts/release.sh notes "$RELEASE_VERSION" > build/RELEASE_NOTES.md

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SuperZen-${{ env.RELEASE_VERSION }}
          path: |
            build/SuperZen-*.dmg
            build/SuperZen-*.dmg.sha256
            build/RELEASE_NOTES.md
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/SuperZen-$RELEASE_VERSION.dmg" \
            "build/SuperZen-$RELEASE_VERSION.dmg.sha256" \
            --verify-tag \
            --title "SuperZen $GITHUB_REF_NAME" \
            --notes-file build/RELEASE_NOTES.md

      - name: Remove signing keychain
        if: always() && env.MACOS_CERTIFICATE_P12 != ''
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
