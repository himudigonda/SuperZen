name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Core package (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test packages
        shell: bash
        run: |
          shopt -s nullglob
          pkgs=(Packages/*/)
          if [ ${#pkgs[@]} -eq 0 ]; then echo "No packages yet"; exit 0; fi
          for pkg in "${pkgs[@]}"; do
            echo "::group::$pkg"
            swift test --package-path "$pkg" --parallel --enable-code-coverage
            echo "::endgroup::"
            bin="$(swift build --package-path "$pkg" --show-bin-path)"
            tests=("$bin"/*PackageTests.xctest)
            report="$(llvm-cov report "${tests[0]}" \
              -instr-profile "$bin/codecov/default.profdata" \
              -ignore-filename-regex '(Tests|\.build|checkouts)/')"
            {
              echo "### Coverage: $(basename "$pkg")"
              echo '```'
              echo "$report"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "$report" | awk '/^TOTAL/ { found = 1; gsub("%", "", $10); if ($10 + 0 < 95) { print "Line coverage " $10 "% is below the 95% floor"; failed = 1 } } END { if (!found) print "No coverage total found"; exit (!found || failed) }'
          done

  release-scripts:
    name: Release scripts (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Shellcheck
        run: shellcheck -x scripts/*.sh scripts/lib/*.sh scripts/tests/*.sh
      - name: Lint workflows
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - name: Test release scripts
        run: scripts/tests/run.sh

  lint:
    name: Format and lint (macOS)
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: swift-format
        run: |
          xcrun swift-format lint --strict --parallel --recursive \
            SuperZen SuperZenTests SuperZenUITests \
            Packages/SuperZenCore/Sources Packages/SuperZenCore/Tests Packages/SuperZenCore/Package.swift scripts
      - name: SwiftLint
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          swiftlint lint --strict

  compat-build:
    name: Build universal app
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project SuperZen.xcodeproj \
            -scheme SuperZen \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            | xcbeautify --renderer github-actions
          tar -C build/DerivedData/Build/Products/Release -czf build/SuperZen-app.tgz SuperZen.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SuperZen-app
          path: build/SuperZen-app.tgz
          if-no-files-found: error

  compat:
    name: Launch on ${{ matrix.os }}
    needs: compat-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: SuperZen-app
          path: build
      - name: Unpack
        run: tar -C build -xzf build/SuperZen-app.tgz
      - name: Check symbols and launch
        run: scripts/smoke_launch.sh build/SuperZen.app build/smoke
      - name: Upload launch evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-${{ matrix.os }}
          path: build/smoke
          if-no-files-found: ignore

  app-macos:
    name: App build and tests (macOS)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - name: Show toolchain
        run: xcodebuild -version && sw_vers
      - name: Build and test
        timeout-minutes: 10
        run: |
          set -o pipefail
          mkdir -p build
          (
            sleep 300
            for pid in $(pgrep -x SuperZen); do
              sample "$pid" 3 -f "build/stalled-$pid.txt" || true
            done
          ) >/dev/null 2>&1 &
          xcodebuild test \
            -project SuperZen.xcodeproj \
            -scheme SuperZen \
            -destination 'platform=macOS' \
            -resultBundlePath build/TestResults.xcresult \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            | xcbeautify --renderer github-actions
      - name: Show samples of a stalled test run
        if: always()
        run: |
          for file in build/stalled-*.txt; do
            [ -f "$file" ] || continue
            echo "== $file"
            sed -n '/Call graph:/,/Total number in stack/p' "$file" | cut -c1-140 | head -160
          done
      - name: Coverage summary
        if: always()
        run: |
          [ -d build/TestResults.xcresult ] || exit 0
          {
            echo "### Coverage: SuperZen app"
            echo '```'
            xcrun xccov view --report --only-targets build/TestResults.xcresult
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TestResults
          path: build/TestResults.xcresult
          if-no-files-found: ignore
